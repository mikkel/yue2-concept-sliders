name: Release YuE2 Space

on:
  pull_request:
    paths: ['space/**', 'release-tools/deploy_space.py', 'release-tools/space-examples.json', '.github/workflows/huggingface-space.yml']
  push:
    branches: [main]
    paths: ['space/**', 'release-tools/deploy_space.py', 'release-tools/space-examples.json', '.github/workflows/huggingface-space.yml']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            space
            release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==0.35.0
      - run: python release-tools/deploy_space.py

  deploy:
    if: github.repository == 'mikkel/yue2-concept-sliders' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: huggingface-space-production
    concurrency:
      group: yue2-space-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            space
            release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==0.35.0
      - run: python release-tools/deploy_space.py --apply
        env:
          HF_SPACE_WRITE_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN }}
